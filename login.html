<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Login | Ayurveda Wellness &amp; Massage Center</title>
<meta name="description" content="Sign in to your Ayurveda Wellness account to manage therapy bookings, packages and wellness preferences.">
<meta name="keywords" content="ayurvedic massage, abhyanga, shirodhara, herbal therapy, wellness retreat, natural healing, ayurveda spa">
<meta name="author" content="Ayurveda Wellness &amp; Massage Center">
<meta name="theme-color" content="#294B38">
<link rel="canonical" href="https://ayurvedawellness.example/login.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Member Login | Ayurveda Wellness">
<meta property="og:description" content="Sign in to your Ayurveda Wellness account to manage therapy bookings, packages and wellness preferences.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/components.css">

<script>(function(){try{var t=localStorage.getItem('ay-theme')||'light';var d=localStorage.getItem('ay-dir')||'ltr';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('dir',d);document.documentElement.setAttribute('lang',d==='rtl'?'ar':'en');}catch(e){}})();</script>
</head>
<body>
<div class="auth-page">
<main id="main" class="auth-card">
<div class="auth-brand">
<a class="brand" href="index.html" aria-label="Ayurveda Wellness &amp; Healing home">
<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.4-2.6-8-6.2-8-10.5C4 7 6.5 4 10 4c.7 0 1.4.1 2 .4.6-.3 1.3-.4 2-.4 3.5 0 6 3 6 6.5 0 4.3-3.6 7.9-8 10.5Z"/><path d="M12 21V8"/><path d="M12 13c-2-1.5-3.2-3-3.5-5M12 13c2-1.5 3.2-3 3.5-5"/></svg></span>
<span class="brand-text"><strong>Ayurveda</strong><small>Wellness &amp; Healing</small></span>
</a>
</div>
<h1 class="auth-title">Welcome Back</h1>
<p class="auth-subtitle">Sign in to continue to your account.</p>
<form class="auth-form" data-auth-form="login" novalidate>
<div class="field">
<label for="login-email">Email Address</label>
<input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" data-rule="required|email" aria-describedby="login-email-error">
<span class="error-msg" id="login-email-error">Enter a valid email address.</span>
</div>
<div class="field">
<label for="login-password">Password</label>
<div class="input-wrap">
<input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" data-rule="required|min:6" aria-describedby="login-password-error">
<button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password" aria-pressed="false"><svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.4 17.4 0 0 1-3 3.8M6.2 6.2A17.4 17.4 0 0 0 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.8-.8M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
</div>
<span class="error-msg" id="login-password-error">Password must be at least 6 characters.</span>
</div>
<div class="auth-meta">
<label class="check-row auth-check"><input type="checkbox" name="remember"><span>Remember me</span></label>
<a href="#" class="auth-link" data-forgot-password>Forgot password?</a>
</div>
<button class="btn btn-primary btn-block auth-submit" type="submit">Sign In</button>
</form>
<div class="divider-text">or continue with</div>
<div class="auth-social">
<a class="btn btn-outline" href="https://www.google.com/" target="_blank" rel="noopener noreferrer" aria-label="Continue with Google (opens in a new tab)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.15-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.85 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.67-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.67 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/></svg><span>Google</span></a>
<a class="btn btn-outline" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Continue with Facebook (opens in a new tab)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.45 2.89h-2.33v6.99A10 10 0 0 0 22 12Z"/></svg><span>Facebook</span></a>
<a class="btn btn-outline" href="https://www.apple.com/" target="_blank" rel="noopener noreferrer" aria-label="Continue with Apple (opens in a new tab)"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.3 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.8.7 3 .7c1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6-.1 0-2.4-.9-2.4-3.2ZM14.1 5.9c.6-.8 1.1-1.9 1-3-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.5Z"/></svg><span>Apple</span></a>
</div>
<p class="auth-alt">Don't have an account? <a href="signup.html">Sign Up</a></p>
</main>
</div>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
